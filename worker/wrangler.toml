# Free-tier Cloudflare Worker standing in for Cloud Functions (which need Firebase's paid plan).
# Secrets are set with `npx wrangler secret put <NAME>`, never written here:
#   FIREBASE_SERVICE_ACCOUNT  - the full JSON key for a Firebase service account
#   CLOUDINARY_API_KEY        - from the Cloudinary dashboard
#   CLOUDINARY_API_SECRET     - from the Cloudinary dashboard
name = "localhive"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true
# Preview URLs would expose a second copy of the API at a different address.
preview_urls = false

[vars]
FIREBASE_PROJECT_ID = "localhive-4a645"
CLOUDINARY_CLOUD_NAME = "bsgju3dx"
# Not secret: it's in google-services.json. Needed to check App Check tokens.
FIREBASE_PROJECT_NUMBER = "1044932675647"
# Set to "true" once every installed app sends App Check tokens; then other callers are refused.
APP_CHECK_REQUIRED = "false"

# Hourly: reminds members about polls closing within a day (see pollReminders in src/index.js),
# and fills in estate nameLower where it's missing.
[triggers]
crons = ["0 * * * *"]
